# deb and rpm: `packaging/package.sh deb|rpm` (env: VERSION, GOARCH, BIN, ICONS)
name: lax
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: GAMMA GAMMA <gammagammaco@gmail.com>
description: |
    A minimal, native Slack desktop client.
    No webview: it reuses the session the Slack desktop app already has.
homepage: https://github.com/wesleybliss/lax
license: PolyForm-Noncommercial-1.0.0
contents:
    - src: ${BIN}
      dst: /usr/bin/lax
      expand: true
      file_info:
          mode: 0755
    - src: LICENSE
      dst: /usr/share/doc/lax/LICENSE
    - src: packaging/linux/com.gammagamma.lax.desktop
      dst: /usr/share/applications/com.gammagamma.lax.desktop
    - src: ${METAINFO}
      dst: /usr/share/metainfo/com.gammagamma.lax.metainfo.xml
      expand: true
    - src: packaging/icon/lax-48.png
      dst: /usr/share/icons/hicolor/48x48/apps/com.gammagamma.lax.png
    - src: packaging/icon/lax-256.png
      dst: /usr/share/icons/hicolor/256x256/apps/com.gammagamma.lax.png
    - src: packaging/icon/lax-512.png
      dst: /usr/share/icons/hicolor/512x512/apps/com.gammagamma.lax.png
overrides:
    deb:
        depends:
            - libgtk-4-1 | libgtk-3-0
            - libsecret-tools
            - xdg-utils
        recommends:
            - fonts-noto-color-emoji
            # Self-update asks for the password through it
            - policykit-1 | pkexec
    rpm:
        depends:
            - (gtk4 or gtk3)
            - libsecret
            - xdg-utils
        recommends:
            - google-noto-color-emoji-fonts
            # Self-update asks for the password through it
            - polkit
