# Cuts a release: tag `vX.Y.Z` and push it, or run this workflow by hand
# (leave the version empty for the next patch). Builds the Linux packages
# for x86_64 and aarch64 and publishes them with SHA256SUMS.
# macOS and Windows are in extra-platforms.yml, by hand, until they are ready.
name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            version:
                description: "Version, like 1.2.3 (empty: the next patch after the latest release)"
                required: false

permissions:
    contents: write

env:
    ZIG_VERSION: 0.17.0

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.v.outputs.version }}
            tag: ${{ steps.v.outputs.tag }}
        steps:
            - id: v
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  INPUT: ${{ inputs.version }}
              run: |
                  if [ "${GITHUB_REF_TYPE}" = tag ]; then
                      version="${GITHUB_REF_NAME#v}"
                  elif [ -n "$INPUT" ]; then
                      version="${INPUT#v}"
                  else
                      latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
                      latest="${latest#v}"
                      if [ -z "$latest" ]; then
                          version=0.1.0
                      else
                          IFS=. read -r major minor patch <<<"${latest%%-*}"
                          version="$major.$minor.$((patch + 1))"
                      fi
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"
                  echo "Releasing v$version"

    linux:
        needs: version
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { arch: x86_64, runner: ubuntu-latest }
                    - { arch: aarch64, runner: ubuntu-24.04-arm }
        runs-on: ${{ matrix.runner }}
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - name: Tools
              run: |
                  go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
                  sudo apt-get update
                  sudo apt-get install -y zip fonts-noto-core fonts-noto-color-emoji flatpak flatpak-builder
                  sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            - name: Test
              run: zig build test
            # glibc 2.31 keeps the binary running on older distros
            - name: Build
              run: zig build -Dtarget=${{ matrix.arch }}-linux-gnu.2.31 -Doptimize=ReleaseSafe
            - name: Packages
              run: packaging/package.sh zip deb rpm appimage
              env:
                  ARCH: ${{ matrix.arch }}
            # Not verified yet: the GNOME runtime and libsecret have to build
            - name: Flatpak
              continue-on-error: true
              run: packaging/package.sh flatpak
              env:
                  ARCH: ${{ matrix.arch }}
            - uses: actions/upload-artifact@v4
              with:
                  name: linux-${{ matrix.arch }}
                  path: |
                      dist/*.zip
                      dist/*.deb
                      dist/*.rpm
                      dist/*.AppImage
                      dist/*.flatpak

    publish:
        needs: [version, linux]
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: assets
                  merge-multiple: true
            - name: Checksums
              run: cd assets && sha256sum * > SHA256SUMS
            # Creates the tag at the built commit when a manual run has none yet
            - name: Release
              run: |
                  gh release create "${{ needs.version.outputs.tag }}" assets/* \
                      --target "${{ github.sha }}" --title "${{ needs.version.outputs.tag }}" --generate-notes
