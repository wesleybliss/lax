# macOS and Windows packages, by hand. Not part of the release yet: Windows
# does not compile (see packaging/README.md) and the macOS job is untested.
# Packages land in the run's artifacts, nothing is published.
name: extra-platforms

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to build, like 1.2.3
                required: true

permissions:
    contents: read

env:
    ZIG_VERSION: 0.17.0
    VERSION: ${{ inputs.version }}

jobs:
    macos:
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - name: Version
              run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
            - name: Build both architectures, then one universal binary
              run: |
                  zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe -p out-arm
                  zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe -p out-x86
                  mkdir -p out
                  lipo -create out-arm/bin/lax out-x86/bin/lax -output out/lax
            # Signing and notarizing happen when these secrets exist: MACOS_CERTIFICATE (base64 .p12),
            # MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
            # Without them the app is ad-hoc signed (users right-click > Open).
            - name: Certificate
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
              run: |
                  [ -n "$MACOS_CERTIFICATE" ] || exit 0
                  echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
                  security create-keychain -p ci "$RUNNER_TEMP/ci.keychain"
                  security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain"
                  security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain"
                  security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain"
                  security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain"
                  security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain" login.keychain
            - name: Packages
              run: packaging/package.sh app dmg zip
              env:
                  ARCH: universal
                  BIN: out/lax
                  MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
            # `app` is Lax.app itself: zipped for the release by the `zip` format
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: |
                      dist/*.zip
                      dist/*.dmg

    windows:
        runs-on: windows-latest
        # Does not build yet: the websocket dependency has no Windows read path in Zig 0.17.
        # Drop this once it does.
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - name: Version
              shell: bash
              run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
            - run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
            - run: dotnet tool install --global wix
            - run: packaging\windows\package.ps1 -Version $env:VERSION
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: |
                      dist/*.zip
                      dist/*.msi
